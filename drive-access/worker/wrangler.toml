name = "drive-access"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Create with: wrangler kv namespace create DRIVE_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "DRIVE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Exact origin of your frontend (GitHub Pages site), no trailing slash.
# Example: "https://yourusername.github.io"
ALLOWED_ORIGIN = "https://REPLACE_WITH_YOUR_PAGES_ORIGIN"

# Set the real values as secrets, never in this file:
#   wrangler secret put SITE_PASSWORD
#   wrangler secret put SESSION_SECRET
#   wrangler secret put GOOGLE_CLIENT_ID
#   wrangler secret put GOOGLE_CLIENT_SECRET
#   wrangler secret put GOOGLE_REDIRECT_URI
