<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batch Downloader</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 760px;
    margin: 40px auto;
    padding: 0 16px;
    background: #f7f7f8;
    color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #17181a; color: #e6e6e6; }
    textarea, .row { background: #232427 !important; color: #e6e6e6 !important; border-color: #3a3b3e !important; }
    .card { background: #1f2022 !important; border-color: #3a3b3e !important; }
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: #777; margin-top: 0; font-size: 0.9rem; }
  textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 140px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.9rem;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    resize: vertical;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 12px 0 20px;
    flex-wrap: wrap;
  }
  label.opt { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
  button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { background: #9ab4ee; cursor: not-allowed; }
  .card {
    border: 1px solid #ddd;
    border-radius: 10px;
    background: white;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid #eee;
  }
  .row:last-child { border-bottom: none; }
  .row .url {
    flex: 1;
    font-size: 0.85rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar {
    width: 120px;
    height: 8px;
    background: #e5e5e5;
    border-radius: 4px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .bar > div {
    height: 100%;
    background: #2563eb;
  }
  .status {
    width: 90px;
    flex-shrink: 0;
    font-size: 0.8rem;
    text-align: right;
  }
  .status.error { color: #dc2626; }
  .status.done { color: #16a34a; }
  a.dl {
    font-size: 0.8rem;
    text-decoration: none;
    color: #2563eb;
    flex-shrink: 0;
  }
  #empty { color: #999; font-size: 0.9rem; padding: 20px; text-align: center; }
</style>
</head>
<body>
  <h1>Batch Video Downloader</h1>
  <p class="sub">Paste one or more video URLs (one per line), then click Download. Runs locally via yt-dlp.</p>

  <textarea id="urls" placeholder="https://example.com/video1&#10;https://example.com/video2"></textarea>

  <div class="controls">
    <button id="startBtn">Download</button>
    <label class="opt"><input type="checkbox" id="audioOnly"> Audio only (mp3)</label>
  </div>

  <div class="card" id="list">
    <div id="empty">No downloads yet.</div>
  </div>

<script>
const urlsEl = document.getElementById('urls');
const audioOnlyEl = document.getElementById('audioOnly');
const startBtn = document.getElementById('startBtn');
const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty');

let pollTimer = null;

function render(items) {
  emptyEl.style.display = items.length ? 'none' : 'block';
  listEl.innerHTML = '';
  if (!items.length) { listEl.appendChild(emptyEl); return; }

  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'row';

    const url = document.createElement('div');
    url.className = 'url';
    url.textContent = item.url;
    row.appendChild(url);

    const bar = document.createElement('div');
    bar.className = 'bar';
    const fill = document.createElement('div');
    fill.style.width = (item.progress || 0) + '%';
    bar.appendChild(fill);
    row.appendChild(bar);

    const status = document.createElement('div');
    status.className = 'status' + (item.status === 'error' ? ' error' : item.status === 'done' ? ' done' : '');
    status.textContent = item.status === 'error' ? 'error' : item.status;
    row.appendChild(status);

    if (item.status === 'done' && item.filename) {
      const link = document.createElement('a');
      link.className = 'dl';
      link.href = '/files/' + encodeURIComponent(item.filename);
      link.textContent = 'Save';
      row.appendChild(link);
    }

    row.title = item.error || '';
    listEl.appendChild(row);
  });
}

async function poll(jobId) {
  const res = await fetch('/api/status/' + jobId);
  const job = await res.json();
  if (job.error) { clearInterval(pollTimer); startBtn.disabled = false; return; }
  render(job.items);
  if (job.done) {
    clearInterval(pollTimer);
    startBtn.disabled = false;
  }
}

startBtn.addEventListener('click', async () => {
  const urls = urlsEl.value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!urls.length) return;

  startBtn.disabled = true;
  const res = await fetch('/api/download', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ urls, audio_only: audioOnlyEl.checked })
  });
  const data = await res.json();
  if (data.error) {
    alert(data.error);
    startBtn.disabled = false;
    return;
  }

  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => poll(data.job_id), 1000);
  poll(data.job_id);
});
</script>
</body>
</html>
