// Mail engine vendored from Thunderbird for Android (Apache-2.0):
// mail/common, mail/protocols/{imap,pop3,smtp}, backend/{api,imap,pop3}.
// See engine/README.md for the source revision and local changes.
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'app.ripple.engine'
    compileSdk 36
    defaultConfig {
        minSdkVersion 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    api 'org.jetbrains:annotations:26.1.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.apache.james:apache-mime4j-core:0.8.15'
    implementation 'org.apache.james:apache-mime4j-dom:0.8.15'
    implementation 'com.squareup.okio:okio:3.18.2'
    implementation 'com.squareup.moshi:moshi:1.15.2'
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.6.4'
    implementation 'com.jcraft:jzlib:1.0.7'
    implementation 'com.beetstra.jutf7:jutf7:1.0.0'
}
