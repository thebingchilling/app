def ripple(String name) {
    def value = System.getenv(name)
    if (value == null && rootProject.file("local.properties").exists()) {
        def props = new Properties()
        rootProject.file("local.properties").withInputStream { props.load(it) }
        value = props.getProperty(name)
    }
    return value ?: ""
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: "androidx.navigation.safeargs"
apply plugin: "com.diffplug.spotless"

android {
    compileSdk 36
    defaultConfig {
        applicationId "app.ripple.mail"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode Integer.parseInt(System.getenv("RIPPLE_BUILD_NUMBER") ?: "1")
        versionName "1.0.0"

        setProperty("archivesBaseName", "Ripple-$versionName")

        // OAuth client IDs for "Sign in with Google/Microsoft" (see README.md).
        // Without them those buttons are hidden and password/app-password login still works.
        buildConfigField "String", "GOOGLE_CLIENT_ID", "\"${ripple("RIPPLE_GOOGLE_CLIENT_ID")}\""
        buildConfigField "String", "MICROSOFT_CLIENT_ID", "\"${ripple("RIPPLE_MICROSOFT_CLIENT_ID")}\""
        def googleClientId = ripple("RIPPLE_GOOGLE_CLIENT_ID")
        def googleRedirectScheme = googleClientId.isEmpty()
                ? "app.ripple.mail.google"
                : "com.googleusercontent.apps." + googleClientId.replace(".apps.googleusercontent.com", "")
        manifestPlaceholders = [
                appAuthRedirectScheme: "app.ripple.mail",
                googleRedirectScheme : googleRedirectScheme
        ]

        compileOptions {
            coreLibraryDesugaringEnabled true
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            if (System.getenv("RIPPLE_KEYSTORE")) {
                storeFile file(System.getenv("RIPPLE_KEYSTORE"))
                storePassword System.getenv("RIPPLE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RIPPLE_KEY_ALIAS")
                keyPassword System.getenv("RIPPLE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig System.getenv("RIPPLE_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            crunchPngs false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = "2g"
            }
        }
    }

    buildFeatures {
        dataBinding true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
    lint {
        disable 'MissingTranslation'
    }
    namespace 'rs.ltt.android'


}

spotless {
    java {
        target '**/*.java'
        googleJavaFormat().aosp().reflowLongStrings()
    }
}

dependencies {

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    //AndroidX
    implementation "androidx.appcompat:appcompat:$rootProject.ext.appcompatVersion"

    implementation "androidx.transition:transition:$rootProject.ext.transitionVersion"
    implementation "androidx.fragment:fragment:$rootProject.ext.fragmentVersion"



    implementation "androidx.lifecycle:lifecycle-extensions:$rootProject.ext.lifecycleVersion"

    implementation "androidx.navigation:navigation-fragment:$rootProject.ext.navVersion"
    implementation "androidx.navigation:navigation-ui:$rootProject.ext.navVersion"

    implementation "androidx.paging:paging-common:$rootProject.ext.pagingVersion"
    implementation "androidx.paging:paging-runtime:$rootProject.ext.pagingVersion"


    implementation "androidx.room:room-runtime:$rootProject.ext.roomVersion"
    implementation "androidx.room:room-guava:$rootProject.ext.roomVersion"
    annotationProcessor "androidx.room:room-compiler:$rootProject.ext.roomVersion"

    implementation "androidx.preference:preference:$rootProject.ext.preferenceVersion"

    implementation "androidx.recyclerview:recyclerview:$rootProject.ext.recyclerViewVersion"

    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$rootProject.ext.swipeRefreshLayoutVersion"

    implementation "androidx.work:work-runtime:$rootProject.ext.workVersion"

    implementation "androidx.exifinterface:exifinterface:$rootProject.ext.exifInterfaceVersion"


    //Google
    implementation "com.google.android.material:material:$rootProject.ext.material"


    //Third party
    implementation 'org.hsluv:hsluv:0.2'

    implementation 'com.github.tony19:logback-android:3.0.0'

    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'


    implementation 'com.google.guava:guava:33.4.6-android'

    // Mail engine (Thunderbird for Android's IMAP/POP3/SMTP code, see engine/)
    implementation project(':engine')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.11.0'
    implementation 'org.apache.james:apache-mime4j-core:0.8.15'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'net.openid:appauth:0.11.1'

    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'com.google.code.gson:gson:2.13.2'

    //Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'com.icegreen:greenmail:2.1.14'
    testImplementation "androidx.work:work-testing:$rootProject.ext.workVersion"
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.ext.espressoVersion"
    androidTestImplementation "androidx.test.espresso:espresso-intents:$rootProject.ext.espressoVersion"
    androidTestImplementation "androidx.test.espresso:espresso-contrib:$rootProject.ext.espressoVersion"
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
