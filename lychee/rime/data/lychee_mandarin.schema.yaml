# Rime schema
# encoding: utf-8
#
# Lychee Mandarin: rime-ice (雾凇拼音, GPL-3.0, https://github.com/iDvel/rime-ice)
# full pinyin with its complete word lists, trimmed for a phone keyboard:
# English is its own language in Lychee, so melt_eng and the radical lookup
# are left out. The matched pinyin is the comment (the app shows readings
# and meanings under each candidate). The Mandarin sentence model is
# optional: the app adds lychee_mandarin.custom.yaml when it is downloaded.

schema:
  schema_id: lychee_mandarin
  name: 普通话
  version: "1.0"
  author:
    - Dvel (rime-ice)
    - Lychee
  description: |-
    Mandarin in full pinyin (rime-ice word lists).

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中, Ａ ]
  - name: ascii_punct
    states: [ 。，, ．， ]
  - name: traditionalization
    states: [ 简, 繁 ]
  - name: emoji
    states: [ 💀, 😄 ]
    reset: 1
  - name: full_shape
    states: [ 半角, 全角 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - lua_translator@*date_translator    # rq 日期, sj 时间, xq 星期
    - lua_translator@*lunar              # nl 农历
    - table_translator@custom_phrase
    - table_translator@cn_en             # T恤, B站…
    - lua_translator@*unicode            # U+ code points
    - lua_translator@*number_translator  # R123 大写数字
    - lua_translator@*calc_translator    # cC1+1 计算器
  filters:
    - lua_filter@*pin_cand_filter
    - lua_filter@*long_word_filter
    - simplifier@emoji
    - simplifier@traditionalize
    - uniquifier

date_translator:
  date: rq
  time: sj
  week: xq
  datetime: dt
  timestamp: ts
  datezh: rqzh
  dateen: rqen

lunar: nl
lunar_template: "{干支年}{生肖}年{俗称农历月}{农历日}"

long_word_filter:
  count: 2
  idx: 4

pin_cand_filter:
  - d	的
  - m	吗 嘛
  - hm	后面

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  delimiter: " '"
  algebra:
    __include: rime_ice.schema:/speller/algebra

translator:
  dictionary: rime_ice
  enable_word_completion: true
  # The matched pinyin ("ni hao") is the comment; the app shows it with
  # tone marks and does not show it raw.
  spelling_hints: 8
  always_show_comments: true
  initial_quality: 1.2
  preedit_format:
    - xform/([jqxy])v/$1u/
    - xform/([nl])v/$1v/
    - xform/([nl])ue/$1ve/

cn_en:
  dictionary: ""
  user_dict: en_dicts/cn_en
  db_class: stabledb
  enable_completion: true
  enable_sentence: false
  initial_quality: 0.5
  comment_format:
    - xform/^.+$//

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 99

emoji:
  option_name: emoji
  opencc_config: emoji.json
  inherit_comment: false

traditionalize:
  option_name: traditionalization
  opencc_config: s2t.json
  tips: none
  tags: [ abc, number, gregorian_to_lunar ]

punctuator:
  __include: default:/punctuator

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    unicode: "^U[a-f0-9]+"
    number: "^R[0-9]+[.]?[0-9]*"
    calculator: "^cC.+"
    gregorian_to_lunar: "^N[0-9]{1,8}"

calculator:
  prefix: "cC"
