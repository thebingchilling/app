name: Build Battery Taskbar EXE

on:
  push:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: battery-taskbar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --noconsole --hidden-import pystray._win32 --name BatteryTaskbar battery_tray.py

      - name: Build debug exe (with console, for diagnosing startup issues)
        run: pyinstaller --onefile --hidden-import pystray._win32 --name BatteryTaskbarDebug battery_tray.py

      - uses: actions/upload-artifact@v4
        with:
          name: BatteryTaskbar-windows-exe
          path: |
            battery-taskbar/dist/BatteryTaskbar.exe
            battery-taskbar/dist/BatteryTaskbarDebug.exe
