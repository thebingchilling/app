name: Build BumBoard

on:
  push:
    branches: [main]
    paths:
      - 'bumboard/**'
      - '.github/workflows/build-bumboard.yml'
  workflow_dispatch: {}

concurrency:
  group: bumboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_VERSION_NAME: 0.1.0-dev.${{ github.run_number }}
    defaults:
      run:
        working-directory: bumboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.1.0 ndk;28.0.13004108 cmake;3.31.6

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon :latinime:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bumboard-${{ env.BUILD_VERSION_NAME }}
          path: bumboard/latinime/build/outputs/apk/debug/*.apk
          if-no-files-found: error
