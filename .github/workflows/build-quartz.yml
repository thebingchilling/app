name: Build Quartz

on:
  push:
    paths:
      - 'quartz/**'
      - '.github/workflows/build-quartz.yml'
  workflow_dispatch: {}

concurrency:
  group: build-quartz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: quartz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The action's default package list includes the removed "tools" package,
      # so name the packages explicitly.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing key
        env:
          QUARTZ_KEYSTORE_BASE64: ${{ secrets.QUARTZ_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$QUARTZ_KEYSTORE_BASE64" ]; then
            echo "$QUARTZ_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quartz.jks"
            echo "QUARTZ_KEYSTORE_PATH=$RUNNER_TEMP/quartz.jks" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew --continue testDebugUnitTest

      - name: Build APKs
        env:
          QUARTZ_KEYSTORE_PASSWORD: ${{ secrets.QUARTZ_KEYSTORE_PASSWORD }}
          QUARTZ_KEY_ALIAS: ${{ secrets.QUARTZ_KEY_ALIAS }}
          QUARTZ_KEY_PASSWORD: ${{ secrets.QUARTZ_KEY_PASSWORD }}
        run: ./gradlew --continue :app:assembleDebug :app:assembleRelease

      - name: Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quartz-apks
          path: quartz/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            quartz/**/build/reports/tests/
            quartz/**/build/reports/lint-results-*.html
          if-no-files-found: ignore
