name: Build Browser (Titanium fork w/ Kiwi-style DevTools + CRX import)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: >
          Runner to build on. Standard GitHub-hosted runners (ubuntu-latest)
          do NOT have enough disk (~25GB usable vs 100GB+ needed) or RAM
          (7GB vs 32GB+ needed) to complete a Chromium Android build - this
          will almost certainly fail there. Use a self-hosted runner with
          ~150GB+ disk and 32GB+ RAM.
        required: true
        type: string
        default: 'self-hosted'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Update Vanadium to latest tag
        working-directory: browser
        run: |
          cd vanadium
          git fetch --tags
          git checkout $(git tag | sort -V | tail -n1)
          cd ..
          git add vanadium
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --staged --quiet; then
            git commit -am "update vanadium"
            git push
          fi

      - name: Set ENV
        run: |
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> $GITHUB_ENV

      - name: Build
        env:
          DEBIAN_FRONTEND: noninteractive
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
        run: |
          ./build.sh

      - name: Set version
        run: |
          export VERSION=$(find chromium/src/out/release -name '*arm64-v8a.apk' | sed 's/.*\///;s/\-arm64-v8a.apk$//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mv $(find chromium/src/out/release -name '*arm64-v8a.aab') $VERSION-${{ env.unix_time }}-arm64-v8a.aab
          mv $(find chromium/src/out/release -name '*arm64-v8a.apk') $VERSION-${{ env.unix_time }}-arm64-v8a.apk
          mv $(find chromium/src/out/release -name '*armeabi-v7a.apk') $VERSION-${{ env.unix_time }}-armeabi-v7a.apk

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.VERSION }}
          tag_name: browser-v${{ env.VERSION }}
          files: |
            browser/${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.aab
            browser/${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk
            browser/${{ env.VERSION }}-${{ env.unix_time }}-armeabi-v7a.apk

      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            browser/${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.aab
            browser/${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk
            browser/${{ env.VERSION }}-${{ env.unix_time }}-armeabi-v7a.apk
