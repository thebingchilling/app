name: Build Tidewall APK

on:
  push:
    branches: [main]
    paths:
      - 'tidewall/**'
      - '.github/workflows/build-tidewall.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 28.2.13676358
      GO_TAGS: with_gvisor,no_tailscale,no_zerotier,no_easytier
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tidewall/core/go.mod
          cache-dependency-path: tidewall/core/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages and SWIG
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;${NDK_VERSION}" "cmake;3.31.6"
          sudo apt-get update -q && sudo apt-get install -y -q swig

      - name: Go engine tests
        working-directory: tidewall/core
        run: go test -tags "$GO_TAGS" ./...

      - name: Build Go engine (libcore.aar)
        working-directory: tidewall/core
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" ./build.sh

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TIDEWALL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tidewall.p12"
            echo "TIDEWALL_KEYSTORE=$RUNNER_TEMP/tidewall.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No TIDEWALL_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key (see tidewall/README.md)."
          fi

      - name: Unit tests and APKs
        working-directory: tidewall/android
        env:
          TIDEWALL_KEYSTORE_PASSWORD: ${{ secrets.TIDEWALL_KEYSTORE_PASSWORD }}
          TIDEWALL_KEY_ALIAS: ${{ secrets.TIDEWALL_KEY_ALIAS }}
          TIDEWALL_KEY_PASSWORD: ${{ secrets.TIDEWALL_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Tidewall-apk
          path: |
            tidewall/android/app/build/outputs/apk/release/app-release.apk
            tidewall/android/app/build/outputs/apk/debug/app-debug.apk
