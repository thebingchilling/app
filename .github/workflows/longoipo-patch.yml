name: Longoipo patch

# Runs when a release is published (or manually for an existing release tag).
# The release must carry exactly one v2RayTun universal APK as an asset.
# The patched, signed APK is attached to the same release as Longoipo-<tag>.apk.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag that holds the universal APK
        required: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bridge self-test
        run: bash longoipo/bridge/run_tests.sh

      - name: Download the universal APK from the release
        run: |
          mkdir -p input
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir input
          # ignore earlier patched builds when re-running on the same release
          find input -name 'Longoipo-*.apk' -delete
          count=$(find input -name '*.apk' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one universal APK asset on release $TAG, found $count:" >&2
            ls -l input >&2
            exit 1
          fi

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.LONGOIPO_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Secret LONGOIPO_KEYSTORE_B64 is not set; see longoipo/README.md" >&2
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/longoipo.p12"

      - name: Patch and sign
        env:
          KS_PASS: ${{ secrets.LONGOIPO_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.LONGOIPO_KEY_PASSWORD }}
        run: |
          python3 longoipo/patcher/patch.py input/*.apk "out/Longoipo-${TAG}.apk" \
            --keystore "$RUNNER_TEMP/longoipo.p12" \
            --alias "${{ secrets.LONGOIPO_KEY_ALIAS }}"

      - name: Attach to the release
        run: gh release upload "$TAG" "out/Longoipo-${TAG}.apk" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/longoipo.p12"
