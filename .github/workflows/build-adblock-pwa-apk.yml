name: Build Adblock PWA APK

on:
  push:
    paths:
      - 'android-adblock-pwa/**'
      - '.github/workflows/build-adblock-pwa-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-adblock-pwa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AdblockPwa-debug-apk
          path: android-adblock-pwa/app/build/outputs/apk/debug/app-debug.apk
